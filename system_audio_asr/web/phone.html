<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoxRibbon · 手机投屏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
/* 字号档位：--fs 由右上角「Aa」切换（小/中/大/特大），存 localStorage。
   默认「大」，手机竖屏远看的场景比桌面更需要大字号。 */
:root{--fs:17px}
body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei UI",system-ui,sans-serif;background:#0a0a1a;color:#e0e0e0;min-height:100vh;min-height:100dvh;font-size:var(--fs)}
header{position:sticky;top:0;z-index:10;padding:12px 16px;background:rgba(10,10,26,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;gap:10px}
.title{font-size:calc(var(--fs) + 1px);font-weight:700;background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:calc(var(--fs) - 5px);padding:3px 8px;border-radius:99px;font-weight:600;white-space:nowrap}
.b-on{background:rgba(34,197,94,.15);color:#4ade80}
.b-off{background:rgba(239,68,68,.15);color:#f87171}
.fs-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#e2e8f0;border-radius:8px;padding:4px 9px;font-size:calc(var(--fs) - 3px);font-weight:700;cursor:pointer;white-space:nowrap}
.fs-btn:active{opacity:.7}
main{padding:12px 16px 24px;display:flex;flex-direction:column;gap:12px}
.img-wrap{border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02)}
.img-wrap img{width:100%;display:block}
.img-actions{display:flex;gap:8px;margin-top:8px}
.img-actions .btn{flex:0 0 auto}
/* 截图解题设置行：作答模式 + 思考模式。两个按钮等宽平分，窄屏下也放得下。 */
.shot-settings{display:flex;flex-direction:column;gap:8px;margin:4px 0}
/* 自动提交那一行：文字可伸长、间隔下拉固定宽度，窄屏下不挤 */
.auto-row{display:flex;align-items:center;gap:8px}
.auto-interval{flex:none;width:104px;padding:6px 8px;font-size:calc(var(--fs) - 4px);
  color:#f1f5f9;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);border-radius:8px}
.solve-opts{display:flex;gap:8px}
.solve-opts .btn{flex:1 1 0;min-width:0;padding:9px 6px;font-size:calc(var(--fs) - 4px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px}
.btn{flex:1;padding:11px 12px;font-size:calc(var(--fs) - 2px);font-weight:600;border:none;border-radius:10px;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,#60a5fa,#a78bfa);color:#fff}
.btn-secondary{background:rgba(255,255,255,.06);color:#e2e8f0;border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;gap:6px}
.btn:active{opacity:.7}
.switchline{display:flex;align-items:center;gap:8px;font-size:calc(var(--fs) - 2px);color:#cbd5e1}
.switchline input{width:20px;height:20px;accent-color:#60a5fa}
#ask-input{flex:1;min-width:0;padding:11px 12px;font-size:calc(var(--fs) - 2px);color:#f1f5f9;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);border-radius:10px;outline:none}
#ask-input:focus{border-color:#60a5fa}
.card{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:12px;font-size:var(--fs);line-height:1.65;white-space:pre-wrap;word-break:break-word}
/* 结构型卡片不能继承 pre-wrap：HTML 源码里的换行与缩进会被当成可见空白渲染，
   把卡片撑高数百像素（聊天卡片曾因此比实际内容高 298px）。
   气泡文本靠各自的内联样式保留 pre-wrap，不受影响。 */
#chat-card,#clipboard-card{white-space:normal}
.card .q{font-size:calc(var(--fs) - 4px);color:#60a5fa;margin-bottom:6px;font-weight:600}
/* 剪贴板卡片：默认折叠，点标题展开。标题行显示简要状态（有没有内容可复制）。 */
.clip-card{padding:0;overflow:hidden}
.clip-card > summary{display:flex;align-items:center;gap:8px;padding:12px;cursor:pointer;list-style:none}
.clip-card > summary::-webkit-details-marker{display:none}
.clip-card > summary::before{content:"▸";color:#64748b;font-size:calc(var(--fs) - 4px);flex:none}
.clip-card[open] > summary::before{content:"▾"}
.clip-brief{margin-left:auto;font-size:calc(var(--fs) - 5px);color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.clip-body{padding:0 12px 12px}
/* 诊断面板：键值对逐行展示，值靠右等宽，便于快速扫读数字 */
.debug-body{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:calc(var(--fs) - 4px);line-height:1.7}
.debug-body .k{color:#94a3b8}
.debug-body .v{color:#e2e8f0;font-variant-numeric:tabular-nums;word-break:break-word}
.debug-body .v.warn{color:#fbbf24}
/* 聊天流限定高度并在内部滚动：回答长短不一时页面高度保持稳定。
   高度按视口给足（一条 500 字回答在默认字号下约需 800px），
   上限用 dvh 保证小屏也不会撑出屏幕。 */
#chat-flow{max-height:min(62dvh,900px);overflow-y:auto;overscroll-behavior:contain}
/* 代码块：解答里的代码用独立深色圆角块展示（等宽字体 + 横向滚动），
   与正文明显区分，抄代码时缩进不会丢、也不会被气泡宽度挤到折行错乱。
   长代码横向滚动而不是折行，避免视觉上多出换行造成抄错。 */
.code-block{display:block;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.08);
  border-radius:8px;padding:10px 12px;margin:8px 0;overflow-x:auto;white-space:pre;
  word-break:normal;overflow-wrap:normal;
  font-family:'SF Mono','Menlo','Consolas','Cascadia Mono',monospace;
  font-size:calc(var(--fs) - 4px);line-height:1.5;color:#e2e8f0;-webkit-overflow-scrolling:touch}
/* 行内代码：与正文同底色区分，不换行。 */
.inline-code{background:rgba(255,255,255,.09);border-radius:4px;padding:1px 5px;
  font-family:'SF Mono','Menlo','Consolas','Cascadia Mono',monospace;
  font-size:calc(var(--fs) - 3px);word-break:break-all}
/* 吸底操作栏：高频按钮固定在屏幕底部，滚动聊天记录时始终可单手点到。
   z-index 低于页头，避免盖住状态栏。窄屏（手机竖屏常见 360-430px）下按钮
   允许多行排布、文字可折行，而不是把某个按钮挤到点不准或看不见。 */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;flex-wrap:wrap;gap:6px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:rgba(10,10,26,.96);backdrop-filter:blur(12px);
  border-top:1px solid rgba(255,255,255,.08)}
.actionbar .btn{flex:1 1 30%;min-width:0;padding:9px 6px;font-size:13px;line-height:1.25;
  white-space:normal;word-break:break-word}
/* 展开模式：仅保留聊天卡片与吸底栏，其余区块收起，聊天区吃满剩余视口高度。
   同时收紧页头与内边距，把省下的空间全部让给回答（仍受屏幕物理高度限制，
   比整屏还长的回答需在框内滚动）。 */
body.chat-expanded main > .switchline,
body.chat-expanded main > .tip,
body.chat-expanded #shot-settings,
body.chat-expanded #img-wrap,
body.chat-expanded #img-actions,
body.chat-expanded #save-tip,
body.chat-expanded #partial,
body.chat-expanded #clipboard-card,
body.chat-expanded #feed{display:none}
body.chat-expanded header{padding:6px 12px}
body.chat-expanded main{padding:8px 10px 8px}
body.chat-expanded #chat-card{padding:10px}
/* 空的状态区不占高度（#err 为空时仍有 line-height 高度） */
body.chat-expanded #err:empty{display:none}
/* 高度 = 视口 - 页头 - main 上下内边距 - 卡片内边距 - 卡片标题行 - 输入行 - 间隙 - 吸底栏 */
body.chat-expanded #chat-flow{max-height:calc(100dvh - 280px)}
/* 非展开模式也要给吸底栏留出空间，否则页面末尾内容被永久遮住 */
/* 底部留白要盖住吸底栏的高度（按钮可折行，窄屏下会占两行）。 */
main{padding-bottom:132px}
.chat-expand-btn{flex:none;padding:4px 10px;font-size:calc(var(--fs) - 6px)}
.card.old{opacity:.55}
.partial{font-size:calc(var(--fs) - 2px);color:#64748b;padding:6px 10px;border-left:2px solid rgba(255,255,255,.1);margin:2px 0}
.err{color:#f87171;font-size:calc(var(--fs) - 3px)}
.tip{color:#64748b;font-size:calc(var(--fs) - 4px);text-align:center;padding:6px}
.cursor::after{content:"▌";color:#60a5fa;animation:blink .8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.hidden{display:none}
/* 操作反馈条：位于折叠区之外，任何时刻都可见。
   连续两条提示时重置计时器，避免第一条被提前吞掉。 */
.toast{background:rgba(96,165,250,.14);border:1px solid rgba(96,165,250,.35);
  color:#cbd5e1;border-radius:8px;padding:8px 10px;font-size:calc(var(--fs) - 3px);
  line-height:1.5;animation:fadeIn .2s ease}
</style>
</head>
<body>
<header>
  <span class="title">VoxRibbon · 手机投屏</span>
  <span style="display:flex;align-items:center;gap:8px">
    <button id="fs-btn" class="fs-btn" type="button" title="切换字号">Aa</button>
    <span id="status" class="badge b-off">未连接</span>
  </span>
</header>
<main>
  <div id="banner" class="err hidden"></div>
  <!-- 短暂的操作反馈（剪贴板结果 / 模式切换 / 自动提交自停等）。
       必须放在折叠区之外：原先写在剪贴板卡片内部的 #clip-status 里，
       而那张卡片默认折叠 —— 所有提示用户根本看不到。 -->
  <div id="toast" class="toast hidden"></div>
  <!-- 截图放最上面：打开页面先看到「电脑现在是什么画面」，这是投屏最主要的信息。
       保存按钮紧跟其后（它保存的就是这张图），也让吸底栏只留高频动作。 -->
  <div id="img-wrap" class="img-wrap hidden"><img id="img" alt="电脑屏幕截图"></div>
  <div id="img-actions" class="img-actions hidden">
    <button id="save-btn" class="btn btn-secondary">💾 保存图片</button>
  </div>
  <div class="tip hidden" id="save-tip">提示：iOS 浏览器长按图片也可保存</div>
  <!-- AI 对话其次：看完画面就看回答与追问。 -->
  <div id="chat-card" class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap">
      <div class="q" style="margin:0">💬 AI 对话（支持追问）</div>
      <span style="display:flex;gap:6px;flex:none">
        <button id="chat-expand" class="btn btn-secondary chat-expand-btn" type="button">⤢ 放大</button>
        <button id="chat-clear" class="btn btn-secondary chat-expand-btn" type="button">清空</button>
      </span>
    </div>
    <div id="chat-flow" style="display:flex;flex-direction:column;gap:8px;margin:8px 0"></div>
    <div class="actions" style="margin:8px 0 0"><input id="ask-input" type="text" placeholder="继续追问…"><button id="ask-send" class="btn btn-primary">发送</button></div>
  </div>
  <!-- 截图设置再往下：它们是「截之前要定的事」，但属于低频调整，不占首屏。
       注意用 class 控制显隐：这里是 .hidden（display:none），不能写成行内
       display:flex —— 行内样式优先级高于类，会让按钮在没截图时也一直显示。 -->
  <div id="shot-settings" class="shot-settings">
    <div class="auto-row">
      <label class="switchline" style="flex:1 1 auto;min-width:0"><input id="auto" type="checkbox">自动提交问题</label>
      <select id="auto-interval" class="auto-interval" title="自动提交的间隔">
        <option value="3">每 3 秒</option>
        <option value="5" selected>每 5 秒</option>
        <option value="10">每 10 秒</option>
        <option value="15">每 15 秒</option>
        <option value="30">每 30 秒</option>
        <option value="60">每 60 秒</option>
      </select>
    </div>
    <div class="auto-row" style="margin-top:6px">
      <label class="switchline" style="flex:1 1 auto;min-width:0" title="开启：电脑静音后自动把字幕发给 AI（默认）。关闭：只累积字幕，点「⚡ 问 AI」才提交"><input id="ai-auto-submit" type="checkbox">字幕 AI 自动提交</label>
    </div>
    <div class="tip" style="padding:0;text-align:left;line-height:1.5">开启后按设定间隔自动截屏并交给 AI 解题（等同自动点「截题+回答」）。会持续调用模型、消耗额度；上一题还在解时本轮自动跳过。</div>
    <div class="solve-opts">
      <button id="mode-toggle" class="btn btn-secondary" type="button" title="切换截图解题的作答模式">🧩 核心代码</button>
      <button id="think-toggle" class="btn btn-secondary" type="button" title="切换截图解题的思考模式">🧠 跟随</button>
    </div>
  </div>
  <div id="partial" class="partial hidden"></div>
  <details id="clipboard-card" class="card clip-card">
    <summary>
      <span class="q" style="margin:0">📋 剪贴板双向同步</span>
      <span id="clip-brief" class="clip-brief"></span>
    </summary>
    <div class="clip-body">
      <div id="pc-clip" style="color:#cbd5e1"></div>
      <div class="actions" style="margin-top:8px">
        <button id="copy-btn" class="btn btn-secondary">复制到手机</button>
        <button id="clip-send" class="btn btn-primary">把手机剪贴板发到电脑</button>
      </div>
      <label class="switchline" style="margin-top:8px"><input id="clip-auto" type="checkbox">自动同步手机剪贴板到电脑（需浏览器授权，HTTP 局域网下多数手机不支持）</label>
      <!-- 提示统一走顶部的 #toast：卡片默认折叠，写在这里等于看不到。 -->
    </div>
  </details>
  <div id="feed"></div>
  <div id="err"></div>
  <div class="tip">本地直连 · 手机与电脑同一网络 · 低延迟</div>
  <details id="debug-card" class="card clip-card">
    <summary>
      <span class="q" style="margin:0">🩺 诊断</span>
      <span id="debug-brief" class="clip-brief">点开查看连接与识别状态</span>
    </summary>
    <div class="clip-body">
      <div id="debug-body" class="debug-body"></div>
      <div class="actions" style="margin-top:8px">
        <button id="debug-reconnect" class="btn btn-secondary">重新连接</button>
        <button id="debug-copy" class="btn btn-secondary">复制诊断信息</button>
        <button id="debug-clear" class="btn btn-secondary">清空错误</button>
      </div>
      <div id="debug-err" class="tip hidden"></div>
    </div>
  </details>
</main>
<!-- 吸底操作栏：放在 main 之外，滚动时始终贴在屏幕底部（面试中单手操作最频繁的动作）。
     safe-area 内边距兜住 iPhone 的 Home 指示条。 -->
<div class="actionbar">
  <button id="shot-btn" class="btn btn-primary">📸 立即截屏</button>
  <button id="add-img-btn" class="btn btn-secondary" title="题干/约束跨屏时先加几张，再点「截题+回答」一起提交">➕ 加一图</button>
  <!-- 清空待解截图：只在攒了图之后出现。没有它时到达上限就只能提交，
       想改截内容得先提交一次（多花一次模型调用）。 -->
  <button id="clear-img-btn" class="btn btn-secondary hidden" title="丢弃已攒的截图，重新截">✕ 清空</button>
  <button id="solve-btn" class="btn btn-primary">🧠 截题+回答</button>
  <button id="bug-btn" class="btn btn-secondary" title="把当前屏幕的代码/报错交给模型找问题">🐛 找 Bug</button>
  <button id="ask-now-btn" class="btn btn-primary" title="立刻把电脑刚识别到的字幕内容交给 AI（不等静音；手动模式下这是唯一的提交方式）">⚡ 问 AI</button>
</div>
<script>
var frag = new URLSearchParams(location.hash.replace(/^#/, ""));
var sid = frag.get("sid") || "";
var tok = frag.get("t") || "";
var ws = null;
var $status = document.getElementById("status");
var $img = document.getElementById("img");
var $imgWrap = document.getElementById("img-wrap");
var $partial = document.getElementById("partial");
var $chatFlow = document.getElementById("chat-flow");
var $askInput = document.getElementById("ask-input");
var $feed = document.getElementById("feed");
var $err = document.getElementById("err");
var $banner = document.getElementById("banner");
var currentImgUrl = null;
// 追问流：本机渲染的问答气泡（服务端另有历史供 AI 上下文，刷新页面不回放）。
var pendingAskText = "";
// 电脑端当前轮次：同一 turn 的流式更新归到同一条回答气泡；题目气泡每轮只渲染一次。
var lastDesktopTurn = 0;

function setStatus(on){
  $status.className = "badge " + (on ? "b-on" : "b-off");
  $status.textContent = on ? "已连接 · 电脑在线" : "未连接";
}
// 错误提示：用 DOM 节点而不是 innerHTML。msg 目前都来自服务端常量，
// 但整页其余部分（回答、字幕）一律不走 HTML 拼接，这里保持一致，
// 免得以后某个调用点把非受信字符串接进来就变成注入面。
function setErr(msg){
  $err.textContent = "";
  if (!msg) return;
  var div = document.createElement("div");
  div.className = "err";
  div.textContent = msg;
  $err.appendChild(div);
}

fetch("/api/phone/status").then(function(r){ return r.json(); }).then(function(data){
  if (!data.enabled) { $banner.textContent = "电脑端尚未启用手机投屏：请在电脑设置页勾选启用并重启 start.ps1。"; $banner.classList.remove("hidden"); }
}).catch(function(){});

function connect(){
  if (!sid || !tok) { setErr("会话参数缺失，请重新扫码"); return; }
  var wsUrl = (location.protocol === "https:" ? "wss:" : "ws:") + "//" + location.host
    + "/relay?role=phone&sid=" + encodeURIComponent(sid) + "&t=" + encodeURIComponent(tok);
  try { ws = new WebSocket(wsUrl); } catch(e){ setErr("连接失败"); return; }
  ws.binaryType = "arraybuffer";
  ws.addEventListener("open", function(){
    setStatus(true); setErr("");
    netStats.connectAt = Date.now();   // 诊断面板显示本次连接时长
  });
  ws.addEventListener("close", function(){
    setStatus(false);
    netStats.connectAt = 0;
    if (debugCard && debugCard.open) renderDebug();
    setTimeout(connect, 2000);
  });
  ws.addEventListener("error", function(){});
  ws.addEventListener("message", function(e){
    if (typeof e.data === "string") handleText(e.data);
    else handleBinary(e.data);
  });
}

function handleBinary(data){
  var blob = data instanceof Blob ? data : new Blob([data], { type: "image/jpeg" });
  var url = URL.createObjectURL(blob);
  if (currentImgUrl) { try { URL.revokeObjectURL(currentImgUrl); } catch(_){} }
  currentImgUrl = url;
  $img.src = url;
  $imgWrap.classList.remove("hidden");
  // 保存按钮跟着截图一起出现/隐藏：没图时留着它只会占位置。
  var actions = document.getElementById("img-actions");
  if (actions) actions.classList.remove("hidden");
  document.getElementById("save-tip").classList.remove("hidden");
}

function saveScreenshot(){
  if (!currentImgUrl) { setErr("还没有截图，先点「立即截屏」"); return; }
  var link = document.createElement("a");
  link.href = currentImgUrl;
  var stamp = new Date();
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  link.download = "voxribbon-" + stamp.getFullYear() + pad(stamp.getMonth()+1) + pad(stamp.getDate())
    + "-" + pad(stamp.getHours()) + pad(stamp.getMinutes()) + pad(stamp.getSeconds()) + ".jpg";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// 清理正文里的 Markdown 标记，但**必须放过代码**：
// ``` 围栏与行内反引号要原样保留给 renderChatBody 解析，围栏之间的内容
// （缩进、空行、符号）一律不碰。此前这里把围栏行删成空行、把反引号全删掉，
// 导致下游按围栏解析的代码块渲染永远拿不到输入 —— 代码块在真实使用中完全不生效。
function stripMarkdown(t){
  if(!t) return t||"";
  var lines = String(t).split("\n");
  var out = [];
  var inCode = false;
  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    if(/^\s*```/.test(line)){       // 围栏行：保留（renderChatBody 靠它切段）
      inCode=!inCode;
      out.push(line);
      continue;
    }
    if(inCode){                     // 代码行：逐字保留（缩进即语义）
      out.push(line);
      continue;
    }
    var s=line.replace(/^\s*#+\s+/,"");          // 标题前缀
    out.push(s.replace(/\*\*/g,"").replace(/__/g,""));  // 加粗（不动反引号）
  }
  // 空行折叠只在正文段生效：代码里的空行是排版的一部分，不能动。
  var result=[];
  var inCode2=false;
  for(var k=0;k<out.length;k++){
    if(/^\s*```/.test(out[k])) inCode2=!inCode2;
    var isBlank=out[k].trim()==="";
    if(!inCode2 && isBlank && result.length && result[result.length-1].trim()==="") continue;
    result.push(out[k]);
  }
  return result.join("\n");
}

// 把回答正文渲染进元素：``` 围栏内的代码用独立代码块，其余按正文，行内 `x` 用行内代码样式。
// 全程用 textContent / createTextNode 构建，不用 innerHTML：回答内容来自模型（可能受截图内容影响），
// 拼 HTML 会引入注入面；用 DOM 节点既安全又能拿到同样样式。
function renderChatBody(el, text){
  el.textContent = "";
  var source = String(text || "");
  // 按 ``` 切成「正文 / 代码」交替段：奇数段是代码（围栏内）。
  var parts = source.split(/^\s*```[^\n]*\n?/m);
  for (var i = 0; i < parts.length; i++){
    var chunk = parts[i];
    if (chunk === "") continue;
    if (i % 2 === 1){
      // 代码段：去掉结尾可能残留的围栏行
      var code = chunk.replace(/\n?^\s*```\s*$/m, "").replace(/\s+$/, "");
      if (!code) continue;
      var pre = document.createElement("pre");
      pre.className = "code-block";
      pre.textContent = code;
      el.appendChild(pre);
    } else {
      // 正文段：拆出行内代码，其余保持原样（含换行）
      var pieces = chunk.split("`");
      for (var j = 0; j < pieces.length; j++){
        if (pieces[j] === "") continue;
        if (j % 2 === 1){
          var inline = document.createElement("code");
          inline.className = "inline-code";
          inline.textContent = pieces[j];
          el.appendChild(inline);
        } else {
          el.appendChild(document.createTextNode(pieces[j]));
        }
      }
    }
  }
}

// 封口最后一条仍在流式状态的气泡。
// 用途：桌面端取消请求/重置会话时发的是 {text:"", done:true}（见 C# CancelAiRequest
// 与 ResetConversation），此时没有正文可写，但那条气泡必须收尾 ——
// 否则它永远带着 ▍ 光标停在「正在生成」，且因 dataset.open 仍是 "1"，
// 同一轮后续的帧还会继续合并进这条旧气泡。
function closeOpenBubble(){
  var last = $chatFlow.lastChild;
  if (!last || !last.dataset || last.dataset.open !== "1") return;
  last.dataset.open = "0";
  var kind = { "chat-me":"me", "chat-solve":"solve", "chat-desktop":"desktop", "chat-question":"question" }[last.dataset.kind] || "ai";
  var body = last.querySelector("span:last-child");
  // 流式期间 setChatContent 会在文本末尾附一个光标字符（见其实现），
  // 封口时要把它去掉，否则气泡收起后仍带着 ▍ 看起来还在生成。
  var text = body ? body.textContent : "";
  text = text.replace(/\s*▍\s*$/, "");
  setChatContent(last, chatPrefix(kind), text, false);
}

function handleText(raw){
  var msg; try { msg = JSON.parse(raw); } catch(_) { return; }
  switch (msg.type) {
    case "hello":
      setStatus(true);
      if (msg.visionMode) applyVisionMode(msg.visionMode);  // 断线重连后同步当前模式
      if (msg.visionThinking !== undefined) applyVisionThinking(msg.visionThinking);
      // 重连后待解张数要跟服务端一致，否则按钮计数会显示成旧的。
      applySolvePending(msg.solvePending || 0, msg.solveImageLimit || 3);
      // 自动提交的勾选与间隔也要回填：状态只活在服务端循环里，
      // 不恢复的话界面显示未勾选、后台其实还在按间隔提交。
      applyAutoState(msg.autoSolve, msg.autoIntervalSec);
      // 字幕 AI 的自动/手动模式（电脑 config.json）：刷新后要显示实际值。
      if (msg.aiAutoSubmit !== undefined) applyAiAutoSubmit(msg.aiAutoSubmit);
      break;
    case "partial":
      if (msg.text) { $partial.textContent = "🎙 " + msg.text; $partial.classList.remove("hidden"); }
      break;
    case "final":
      $partial.classList.add("hidden");
      if (msg.text) addTranscript(msg.text);
      break;
    case "status":
      break;
    case "ai":
      // source: ask=手机追问 / solve=截图解题 / 无 source（C# PhoneAiFeed）=电脑端字幕 AI。
      // 电脑端在请求发起时就单独发一帧「只有题目、没有正文」的消息，手机先显示问题，
      // 再看着回答逐步长出来；同一 turn 的后续帧只更新回答气泡，题目不会重复。
      // 空文本且无题目（桌面重置时的 Post("", true)）只用于封口，不建气泡。
      var turn = msg.turn || 0;
      if (msg.question && turn && turn !== lastDesktopTurn) {
        lastDesktopTurn = turn;
        appendChat("question", stripMarkdown(msg.question), false);
      }
      if (!String(msg.text || "").trim()) {
        if (msg.source === "ask") pendingAskText = "";
        // 空文本 + done 是「收尾」信号（桌面取消/重置）：要把上一条气泡封口。
        if (msg.done) closeOpenBubble();
        break;
      }
      if (msg.source === "ask") {
        appendChat("ai", stripMarkdown(msg.text || ""), !msg.done);
        if (msg.done) pendingAskText = "";
      } else if (msg.source === "solve") {
        appendChat("solve", stripMarkdown(msg.text || ""), !msg.done);
      } else {
        appendChat("desktop", stripMarkdown(msg.text || ""), !msg.done, turn);
      }
      break;
    case "session_reset":
      // 「开始新一场」：清空本场聊天流，避免上一场问答残留在手机上。
      $chatFlow.innerHTML = "";
      pendingAskText = "";
      lastDesktopTurn = 0;
      $partial.classList.add("hidden");
      $partial.textContent = "";
      // 上一场攒的待解截图已被服务端清掉，按钮计数同步归零。
      applySolvePending(0, solveImageLimit);
      // 服务端会连自动循环一起停掉（见 begin_new_session），勾选状态要跟着复位，
      // 否则界面显示还在自动提交、实际已经停了。
      applyAutoState(false, 0);
      setErr("");
      break;
    case "chat_cleared":
      $chatFlow.innerHTML = "";
      break;
    case "error":
      setErr(msg.message || "");
      break;
    case "clipboard":
      showPcClipboard(msg.text || "");
      break;
    case "clipboard_ack":
      showClipStatus(msg.ok ? "✓ 已写入电脑剪贴板，电脑上直接 Ctrl+V" : "✗ 写入失败，请重试");
      break;
    case "pong":
      if (typeof msg.t === "number") {
        netStats.rtt = Math.max(0, Date.now() - msg.t);
        netStats.lastPong = Date.now();
        if (debugCard && debugCard.open) renderDebug();
      }
      break;
    case "debug":
      netStats.lastSnapshot = msg;
      if (debugCard && debugCard.open) renderDebug();
      break;
    case "vision_mode":
      applyVisionMode(msg.mode || "core_code");
      break;
    case "vision_thinking":
      applyVisionThinking(msg.mode || "");
      break;
    case "solve_pending":
      applySolvePending(msg.count || 0, msg.limit || 3);
      break;
    case "auto_state":
      // 服务端自停（连续失败到上限）后推的复位帧：不接的话勾选还亮着、
      // 实际循环已经退出，用户以为还在自动提交。
      // 具体原因与次数已由服务端的气泡说明，这里只做一次轻提示。
      applyAutoState(msg.on, msg.intervalSec);
      if (!msg.on) showClipStatus("自动提交已停止");
      break;
    case "auto_submit":
      // 字幕 AI 的自动/手动模式回执（多台手机保持一致，与 vision_mode 同一模式）。
      // 桌面切模式后也会推这一帧（它写盘后主动广播，不再只等手机自己操作或重连），
      // 所以这里要提示「是谁改的」都能看到：值没变就不提示，避免同一改动弹两次
      // （手机自己切换 → 回执一条；桌面重载配置后又广播同一个值 → 第二条）。
      var changed = aiAutoSubmitState !== msg.on;
      applyAiAutoSubmit(msg.on);
      if (changed) {
        showClipStatus(msg.on ? "字幕 AI：静音后自动提交" : "字幕 AI：改为手动（点「⚡ 问 AI」提交）");
      }
      break;
    case "manual_ai_unavailable":
      // 桌面不在线：字幕文本只存在于电脑端进程，这条请求必然无人处理。
      // 必须如实告知，否则用户以为点了就有反应（只在有内容时才提示，避免噪音）。
      showClipStatus("⚠ " + (msg.message || "电脑端未连接，无法提交字幕"));
      break;
    case "notice":
      // 桌面端发来的提示（如「手动提交被拒」的原因）。
      // 用户此时正看着手机，提示条是唯一能看到反馈的地方。
      // revert：写盘失败时把误翻的控件退回原值。服务端此刻读不出配置文件，
      // 回任何值都是猜的，所以基准由手机自己提供（最后一次确认过的值）。
      if (msg.revert === "auto_submit" && aiAutoSubmitState !== null) {
        applyAiAutoSubmit(aiAutoSubmitState);
      }
      showClipStatus("⚠ " + (msg.message || "电脑端拒绝了本次提交"));
      break;
  }
}

// ---------------------------------------------------------------- 作答模式切换
// 模式存在电脑端 config（visionAnswerMode），手机只做触发与展示：
// {type:"vision_mode", mode} → 服务端只写这一个键 → 广播回来统一刷新（多台手机一致）。
var visionMode = "core_code";
function applyVisionMode(mode){
  visionMode = mode === "acm" ? "acm" : "core_code";
  var btn = document.getElementById("mode-toggle");
  if (!btn) return;
  var isAcm = visionMode === "acm";
  btn.textContent = isAcm ? "🧩 ACM 完整程序" : "🧩 核心代码";
  btn.title = isAcm
    ? "当前：ACM 模式（给完整可编译程序）—— 点击切回核心代码"
    : "当前：核心代码模式（只给关键实现）—— 点击切到 ACM";
  btn.style.borderColor = isAcm ? "rgba(96,165,250,.5)" : "";
  btn.style.color = isAcm ? "#93c5fd" : "";
}
document.getElementById("mode-toggle").onclick = function(){
  var next = visionMode === "acm" ? "core_code" : "acm";
  if (send({ type:"vision_mode", mode: next })) {
    setErr("");
    showClipStatus("已切换为" + (next === "acm" ? "ACM 完整程序" : "核心代码") + "模式");
  }
};

// 解题思考模式循环：跟随字幕 AI → 关闭 → 自动 → 中度 → 深度 → 跟随。
// 面试中「关闭」首字最快（约 1 秒）；「中度/深度」显式让模型推理，但实测很慢
// （中度约 23 秒、深度约 33 秒，推理上万 token），只适合难题或笔试离线场景。
// 与作答模式同样是「服务端只写一个键 + 广播回来」，多台手机保持一致。
var visionThinking = "";
var THINKING_ORDER = ["", "off", "auto", "medium", "high"];
var THINKING_LABELS = {
  "": "🧠 跟随",
  "off": "🧠 关闭思考",
  "auto": "🧠 自动思考",
  "medium": "🧠 中度思考",
  "high": "🧠 深度思考"
};
var THINKING_TITLES = {
  "": "当前：跟随字幕 AI 的思考模式 —— 点击切到「关闭思考」",
  "off": "当前：关闭思考（首字最快）—— 点击切到「自动思考」",
  "auto": "当前：自动思考（不干预，由模型决定）—— 点击切到「中度思考」",
  "medium": "当前：中度思考（显式推理，实测约 23 秒）—— 点击切到「深度思考」",
  "high": "当前：深度思考（最强推理，实测约 33 秒；建议只用于难题）—— 点击切回「跟随」"
};
// 推理档会显著变慢，用不同颜色提示「当前不是实时档」。
var THINKING_SLOW = { "medium": true, "high": true };
function applyVisionThinking(mode){
  visionThinking = THINKING_LABELS[mode] ? mode : "";
  var btn = document.getElementById("think-toggle");
  if (!btn) return;
  btn.textContent = THINKING_LABELS[visionThinking];
  btn.title = THINKING_TITLES[visionThinking];
  // 只在非默认态高亮：默认「跟随」与普通按钮无异，避免误导成已开启特殊模式。
  // 推理档用红色系（比 off/auto 的黄色更醒目），提示会明显变慢。
  var slow = THINKING_SLOW[visionThinking];
  var active = visionThinking !== "";
  btn.style.borderColor = slow ? "rgba(248,113,113,.55)" : (active ? "rgba(251,191,36,.5)" : "");
  btn.style.color = slow ? "#fca5a5" : (active ? "#fcd34d" : "");
}
document.getElementById("think-toggle").onclick = function(){
  var index = THINKING_ORDER.indexOf(visionThinking);
  var next = THINKING_ORDER[(index + 1) % THINKING_ORDER.length];
  if (send({ type:"vision_thinking", mode: next })) {
    setErr("");
    showClipStatus("解题思考：" + THINKING_LABELS[next].replace("🧠 ", ""));
  }
};

var pcClipText = "";
var lastPhonePush = "";
// 折叠卡片常驻显示，标题行用一行摘要提示"电脑剪贴板里有什么"，
// 有内容时自动展开一次，避免用户不知道要来看这里。
function setClipBrief(text){
  var brief = document.getElementById("clip-brief");
  if (!brief) return;
  var oneLine = (text || "").replace(/\s+/g, " ").trim();
  brief.textContent = oneLine ? oneLine.slice(0, 40) + (oneLine.length > 40 ? "…" : "") : "暂无电脑剪贴板内容";
}
function showPcClipboard(text){
  if (!text) return;
  pcClipText = text;
  document.getElementById("pc-clip").textContent = text.length > 600 ? text.slice(0, 600) + "…" : text;
  // 不自动展开卡片：电脑剪贴板变化频繁（面试中复制粘贴很常见），强制弹开会
  // 反复顶动页面、打断阅读回答。可发现性由标题行的摘要（setClipBrief）兜住，
  // 用户想看全文时自己点开——点开后也不再被后续内容强制关闭。
  setClipBrief(text);
}
// 聊天流内滚动到底。不能用 window.scrollTo(document.body.scrollHeight)：
// 页面底部是字幕历史与页脚，那样会把聊天卡片顶出视野，回答越长推得越远。
// 滚动的是 #chat-flow（限高并 overflow-y:auto），不是外层卡片。
function chatAtBottom(){
  var flow = document.getElementById("chat-flow");
  if (!flow) return true;
  return flow.scrollHeight - flow.scrollTop - flow.clientHeight < 80;
}
function scrollChatToBottom(){
  var flow = document.getElementById("chat-flow");
  if (!flow) return;
  flow.scrollTop = flow.scrollHeight;
}
function addTranscript(text){
  var div = document.createElement("div");
  div.className = "card";
  div.textContent = text;
  $feed.appendChild(div);
  while ($feed.children.length > 40) $feed.removeChild($feed.firstChild);
}

// 追问聊天流：me=我的问题（蓝） / ai=AI 回答 / solve=截图解题（绿标记）。
// 单条气泡原地更新（流式），新气泡追加，历史保留（上限 50 条），不再互相覆盖。
// 气泡前缀：原地更新时也要带上，否则流式改写会丢掉图标。
function chatPrefix(kind){
  if (kind === "me") return "🧑 ";
  if (kind === "solve") return "📸 ";
  if (kind === "desktop") return "🖥 ";
  if (kind === "question") return "❓ ";
  return "🤖 ";
}
function appendChat(kind, text, streaming, turn){
  var last = $chatFlow.lastChild;
  var expected = kind === "me" ? "chat-me"
    : (kind === "solve" ? "chat-solve"
    : (kind === "desktop" ? "chat-desktop"
    : (kind === "question" ? "chat-question" : "chat-ai")));
  var prefix = chatPrefix(kind);
  // 必须在写入前判断"用户是否本来就在底部"：长回答一帧可能长高几百像素，
  // 写完再判断会被误当成"用户正在翻看历史"，从而停止跟随。
  var follow = chatAtBottom();
  // 上一条仍是"打开"状态就原地改写（含最终 done 封口）。
  // 条件不能要求 streaming：done 消息也要落到同一条气泡，否则会多出一个重复气泡。
  // 带 turn 的（电脑端）额外校验轮次，避免前一轮没收尾时串到下一轮。
  var sameTurn = !turn || !last || !last.dataset || String(last.dataset.turn) === String(turn);
  if (last && last.dataset && last.dataset.kind === expected
      && last.dataset.open === "1" && sameTurn) {
    last.dataset.open = streaming ? "1" : "0";
    setChatContent(last, prefix, text, streaming);
    if (follow || kind === "me") scrollChatToBottom();
    return;
  }
  var div = document.createElement("div");
  div.dataset.kind = expected;
  div.dataset.open = streaming ? "1" : "0";
  if (turn) div.dataset.turn = String(turn);
  div.style.padding = "8px 10px";
  div.style.borderRadius = "10px";
  div.style.whiteSpace = "pre-wrap";
  div.style.wordBreak = "break-word";
  div.style.fontSize = "var(--fs)";
  div.style.lineHeight = "1.65";
  if (kind === "me") {
    div.style.background = "rgba(96,165,250,.18)";
    div.style.border = "1px solid rgba(96,165,250,.35)";
    div.style.alignSelf = "flex-end";
  } else if (kind === "solve") {
    div.style.background = "rgba(34,197,94,.10)";
    div.style.border = "1px solid rgba(34,197,94,.25)";
  } else if (kind === "question") {
    // 电脑端识别出的题目：蓝色描边、无底色，和下面的回答明显成对。
    div.style.background = "rgba(96,165,250,.10)";
    div.style.border = "1px dashed rgba(96,165,250,.45)";
    div.style.fontWeight = "600";
  } else if (kind === "desktop") {
    // 电脑端 AI 回答：紫色标记，与手机追问的普通回答区分开。
    div.style.background = "rgba(167,139,250,.12)";
    div.style.border = "1px solid rgba(167,139,250,.3)";
  } else {
    div.style.background = "rgba(255,255,255,.05)";
    div.style.border = "1px solid rgba(255,255,255,.10)";
  }
  setChatContent(div, prefix, text, streaming);
  $chatFlow.appendChild(div);
  while ($chatFlow.children.length > 50) $chatFlow.removeChild($chatFlow.firstChild);
  // 新气泡出现时，只有用户原本就在底部才跟随（自己发的提问除外）。
  if (follow || kind === "me") scrollChatToBottom();
}

// 写入气泡内容：流式期间保持纯文本，只在 done 时渲染代码块。
// 流式期间不能渲染：围栏只闭合到一半（``` 还没配上收尾），会把后半段正文误判成代码。
// 前缀（🤖/📸）与流式光标 ▍ 用独立节点，渲染时不会被 code 样式影响。
function setChatContent(el, prefix, text, streaming){
  el.textContent = "";
  var head = document.createElement("span");
  head.textContent = prefix;
  el.appendChild(head);
  var body = document.createElement("span");
  if (streaming){
    body.textContent = String(text || "") + " ▍";
  } else {
    body.style.whiteSpace = "pre-wrap";
    renderChatBody(body, text);
  }
  el.appendChild(body);
}

function send(obj){
  if (!ws || ws.readyState !== WebSocket.OPEN) { setErr("连接还没建立，等一秒再试"); return false; }
  try { ws.send(JSON.stringify(obj)); return true; } catch(_){ setErr("发送失败"); return false; }
}

document.getElementById("shot-btn").onclick = function(){

// 自动提交状态回填（hello 帧）。服务端是唯一真相：勾选与间隔都以它为准。
function applyAutoState(on, intervalSec){
  var box = document.getElementById("auto");
  if (box) box.checked = !!on;
  var sel = document.getElementById("auto-interval");
  if (sel && intervalSec) {
    var want = String(intervalSec);
    // 只接受下拉里存在的档位，避免服务端返回一个未列出的值把选择框置空
    var known = Array.prototype.some.call(sel.options, function(o){ return o.value === want; });
    if (known) sel.value = want;
  }
}
// 自动提交问题：勾选后按设定间隔自动截屏 + 自动解题（等同反复点「截题+回答」）。
// 勾选状态只活在服务端循环里，所以每次变更都把 on/interval/solve 一起发过去；
// 刷新页面时由 hello 帧回填（否则界面显示未勾选、服务端却还在跑）。
function currentAutoIntervalMs(){
  var sel = document.getElementById("auto-interval");
  return (sel && Number(sel.value) ? Number(sel.value) : 5) * 1000;
}
function sendAutoState(){
  var on = document.getElementById("auto").checked;
  send({ type:"auto", on: on, interval: currentAutoIntervalMs(), solve: true });
}
document.getElementById("auto").onchange = function(){
  sendAutoState();
  if (this.checked) showClipStatus("已开启自动提交：每 " + currentAutoIntervalMs()/1000 + " 秒自动截屏并解题");
};
// 间隔改动后，若已在运行要立刻按新间隔重启循环（否则要等下一次重新勾选才生效）
document.getElementById("auto-interval").onchange = function(){
  if (document.getElementById("auto").checked) {
    sendAutoState();
    showClipStatus("自动提交间隔已改为每 " + currentAutoIntervalMs()/1000 + " 秒");
  }
};
// 字幕 AI 的自动/手动模式：写的是电脑 config.json 的 aiAutoSubmit（与桌面共用），
// 桌面每秒重载一次配置，约 1 秒生效。服务端会回一帧 auto_submit 确认。
// 与上面的「自动提交问题」（定时截图解题）是两件不同的事，不要混淆。
// 已知状态：null = 还没从服务端得知过。用来判断收到的一帧是否带来了新信息 ——
// 桌面切模式后会主动广播，手机自己切换后桌面重载配置又会广播一次同一个值，
// 不做去重会连弹两条一样的提示。
var aiAutoSubmitState = null;
function applyAiAutoSubmit(on){
  var box = document.getElementById("ai-auto-submit");
  if (box) box.checked = !!on;
  aiAutoSubmitState = !!on;
}
document.getElementById("ai-auto-submit").onchange = function(){
  var on = this.checked;
  if (send({ type:"auto_submit", on: on })) {
    setErr("");
  } else {
    // 发送失败要把界面改回去，否则显示的状态与电脑实际行为相反。
    this.checked = !on;
    showClipStatus("连接未就绪，未改动");
  }
};

// 手机剪贴板 → 电脑：浏览器无法后台读剪贴板，需一次用户点击授权。
// 勾选「自动同步」后：首次点击触发授权，之后按固定间隔轮询并推送变化，
// 不再需要每次手点按钮（Chrome/Edge 支持；iOS Safari 不支持则回落为手动）。
var clipAutoTimer = null;
var CLIP_AUTO_INTERVAL_MS = 1500;

function pushPhoneClipboard(text, silent){
  var trimmed = (text || "").trim();
  if (!trimmed) {
    if (!silent) showClipStatus("手机剪贴板是空的，先在手机上复制一段文字");
    return false;
  }
  if (trimmed === lastPhonePush) return false;
  lastPhonePush = trimmed;
  if (send({ type: "clipboard", text: trimmed })) {
    if (!silent) showClipStatus("已发送到电脑剪贴板");
    return true;
  }
  return false;
}

function stopClipAuto(){
  if (clipAutoTimer) { clearInterval(clipAutoTimer); clipAutoTimer = null; }
}

async function clipAutoTick(){
  if (!navigator.clipboard || !navigator.clipboard.readText) { stopClipAuto(); return; }
  try {
    pushPhoneClipboard(await navigator.clipboard.readText(), true);
  } catch (err) {
    // 授权被撤销或页面转后台：停止轮询并复位开关，避免无意义的报错。
    stopClipAuto();
    var box = document.getElementById("clip-auto");
    if (box) box.checked = false;
    showClipStatus("自动同步已停止：浏览器未授予剪贴板读取权限");
  }
}

document.getElementById("clip-auto").onchange = function(e){
  if (!e.target.checked) { stopClipAuto(); showClipStatus("已关闭自动同步"); return; }
  if (!navigator.clipboard || !navigator.clipboard.readText) {
    e.target.checked = false;
    showClipStatus("当前浏览器不支持自动读取剪贴板，请继续用下方按钮手动发送");
    return;
  }
  navigator.clipboard.readText().then(function(text){
    pushPhoneClipboard(text, true);
    stopClipAuto();
    clipAutoTimer = setInterval(clipAutoTick, CLIP_AUTO_INTERVAL_MS);
    showClipStatus("自动同步已开启，手机上复制的文字会自动发到电脑");
  }, function(){
    e.target.checked = false;
    showClipStatus("浏览器拒绝读取手机剪贴板：请在弹出的提示中选择允许，或改用下方按钮");
  });
};

// 页面回到前台时补一次同步，避免后台被浏览器挂起期间漏掉内容。
document.addEventListener("visibilitychange", function(){
  if (!document.hidden && clipAutoTimer) clipAutoTick();
});

// 手机剪贴板 → 电脑：手动按钮（未开启自动同步时的入口）。
document.getElementById("clip-send").onclick = function(){
  var finish = function(text){
    pushPhoneClipboard(text, false);
  };
  if (navigator.clipboard && navigator.clipboard.readText) {
    navigator.clipboard.readText().then(function(text){
      finish(text);
    }).catch(function(){
      showClipStatus("浏览器拒绝读取手机剪贴板，请点「复制到手机」卡片外任意处再试，或换 Chrome");
    });
  } else {
    var text = window.prompt("粘贴要发送到电脑的文字：");
    if (text !== null) finish(text);
  }
};
// 短暂反馈：写在 #toast（折叠区之外，任何时刻可见）。
// 剪贴板卡片里的 #clip-status 是折叠的，写在那里等于用户看不到
// —— 剪贴板结果、模式切换确认、自动提交自停通知都曾因此静默。
var toastTimer = null;
function showClipStatus(message){
  var toast = document.getElementById("toast");
  if (!toast) return;
  toast.textContent = message;
  toast.classList.remove("hidden");
  // 重新计时而不是叠加：连续两条提示时，第一条不该被第二条的计时器提前隐藏。
  if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
  toastTimer = setTimeout(function(){
    toast.classList.add("hidden");
    toastTimer = null;
  }, 3000);
}

// ---------------------------------------------------------------- 诊断面板
// 数据来源：WS {type:"debug"} 快照（服务端只放白名单字段：连接数/识别状态/
// 队列积压/错误等，不含任何凭据或用户资料）。手机在局域网调不到 /api/* 管理接口
// （那些要求回环地址），所以诊断只能走 relay。
var netStats = { rtt: null, lastPong: 0, lastSnapshot: null, connectAt: 0 };

function debugRow(key, value, warn){
  var k = document.createElement("span"); k.className = "k"; k.textContent = key;
  var v = document.createElement("span"); v.className = "v" + (warn ? " warn" : ""); v.textContent = value;
  return [k, v];
}

function renderDebug(){
  var box = document.getElementById("debug-body");
  if (!box) return;
  var snap = netStats.lastSnapshot || {};
  box.innerHTML = "";
  var rows = [];
  // 本地可测的（不依赖快照）
  var online = (ws && ws.readyState === WebSocket.OPEN);
  rows.push(["连接", online ? "✓ 已连接" : "✗ 未连接", !online]);
  if (netStats.connectAt) {
    var up = Math.round((Date.now() - netStats.connectAt) / 1000);
    rows.push(["本次连接时长", up + " 秒"]);
  }
  rows.push(["往返延迟", netStats.rtt == null ? "测量中…"
    : (netStats.rtt + " ms" + (netStats.rtt > 500 ? "（偏高）" : "")), netStats.rtt > 500]);
  if (!snap.type) {
    rows.push(["电脑端快照", "等待中…（面板打开后约 2 秒）"]);
  } else {
    rows.push(["识别状态", String(snap.asrState || "?") + " · " + String(snap.asrLanguage || "?"),
      snap.asrState !== "capturing"]);
    rows.push(["解题引擎", snap.solveBusy ? "进行中" : "空闲"]);
    rows.push(["连接设备数", String(snap.phones == null ? "?" : snap.phones)]);
    rows.push(["场次编号", String(snap.session == null ? "?" : snap.session)]);
    rows.push(["最近题图", (snap.images || 0) + " 字节"]);
    rows.push(["剪贴板缓存", (snap.clipboardChars || 0) + " 字"]);
    if (snap.wsQueue != null) {
      rows.push(["服务端待发队列", String(snap.wsQueue) + (snap.wsQueue > 50 ? "（积压）" : ""),
        snap.wsQueue > 50]);
    }
    if (snap.wsClients != null) rows.push(["服务端在线浏览器", String(snap.wsClients)]);
    rows.push(["AI Key", snap.aiKeySet ? "✓ 已配置" : "✗ 未配置", !snap.aiKeySet]);
    rows.push(["视觉模型 Key", snap.visionKeySet ? "✓ 已配置" : "✗ 未配置", !snap.visionKeySet]);
    rows.push(["本场识别条目", String(snap.recordFinals == null ? "?" : snap.recordFinals)]);
    rows.push(["本场解题次数", String(snap.recordSolves == null ? "?" : snap.recordSolves)]);
    if (snap.lastError) {
      rows.push(["最近错误", String(snap.lastError), true]);
      if (snap.lastErrorAt) rows.push(["错误时间", String(snap.lastErrorAt).slice(11, 19)]);
    } else {
      rows.push(["最近错误", "无"]);
    }
  }
  rows.forEach(function(pair){
    debugRow(pair[0], pair[1], pair[2]).forEach(function(el){ box.appendChild(el); });
  });
  var brief = document.getElementById("debug-brief");
  if (brief) {
    brief.textContent = (online ? "已连接" : "未连接")
      + (netStats.rtt != null ? " · " + netStats.rtt + "ms" : "")
      + (snap.asrState ? " · " + snap.asrState : "");
  }
}

function setDebugErr(message){
  var el = document.getElementById("debug-err");
  if (!el) return;
  el.textContent = message || "";
  if (message) el.classList.remove("hidden"); else el.classList.add("hidden");
}

// 诊断面板打开时订阅快照（服务端每 2 秒推一次），关闭即退订省流量。
var debugCard = document.getElementById("debug-card");
if (debugCard) {
  debugCard.addEventListener("toggle", function(){
    if (debugCard.open) {
      send({ type:"debug", on:true });
      send({ type:"ping", t: Date.now() });
      renderDebug();
      setTimeout(function(){ send({ type:"ping", t: Date.now() }); }, 600);
    } else {
      send({ type:"debug", on:false });
    }
  });
}
document.getElementById("debug-reconnect").onclick = function(){
  setDebugErr("");
  try { if (ws) ws.close(); } catch(_){}
  // 复用既有的 close 处理器自动重连（2 秒后），这里只给用户即时反馈
  setDebugErr("正在重新连接…");
  setTimeout(function(){ setDebugErr(ws && ws.readyState === WebSocket.OPEN ? "" : "重连中，若一直失败请检查是否同一网络"); }, 3000);
};
document.getElementById("debug-copy").onclick = function(){
  var snap = netStats.lastSnapshot || {};
  var lines = ["VoxRibbon 手机诊断",
    "时间: " + new Date().toLocaleString(),
    "连接: " + (ws && ws.readyState === WebSocket.OPEN ? "已连接" : "未连接"),
    "往返延迟: " + (netStats.rtt == null ? "未知" : netStats.rtt + " ms"),
    "识别: " + (snap.asrState || "?") + " / " + (snap.asrLanguage || "?") + " 语言",
    "解题引擎: " + (snap.solveBusy ? "进行中" : "空闲"),
    "设备数: " + (snap.phones == null ? "?" : snap.phones),
    "服务端队列: " + (snap.wsQueue == null ? "?" : snap.wsQueue),
    "AI Key: " + (snap.aiKeySet ? "已配置" : "未配置"),
    "视觉 Key: " + (snap.visionKeySet ? "已配置" : "未配置"),
    "最近错误: " + (snap.lastError || "无")];
  var text = lines.join("\n");
  if (navigator.clipboard && navigator.clipboard.writeText) {

      function(){ setDebugErr("复制失败，请手动选择文本"); });
  } else {
    window.prompt("复制以下内容：", text);
  }
};
document.getElementById("debug-clear").onclick = function(){
  setErr("");
  setDebugErr("已清空本机错误提示");
  setTimeout(function(){ setDebugErr(""); }, 2000);
};

// 字号档位：点「Aa」循环切换，记住选择。默认「大」——面试时手机常放在远处看。
// localStorage 必须兜底：浏览器禁用存储 / 配额满 / WebView 策略拦截时它会抛异常，
// 而顶层初始化（applyFs(fsIndex())）在 connect() 之前 —— 抛出去会让整页脚本中断，
// 表现是永远「未连接」，且没有任何提示。
var FS_STEPS = [{name:"小",px:15},{name:"中",px:17},{name:"大",px:19},{name:"特大",px:22}];
var FS_DEFAULT = 2;
function fsIndex(){
  var raw = null;
  try { raw = localStorage.getItem("voxribbon.fs"); } catch(_) { return FS_DEFAULT; }
  var saved = parseInt(raw || "", 10);
  return (saved >= 0 && saved < FS_STEPS.length) ? saved : FS_DEFAULT;
}
function applyFs(index){
  var step = FS_STEPS[index];
  document.documentElement.style.setProperty("--fs", step.px + "px");
  var btn = document.getElementById("fs-btn");
  btn.textContent = "Aa " + step.name;
  btn.title = "字号：" + step.name + "（点击切换）";
  try { localStorage.setItem("voxribbon.fs", String(index)); } catch(_) { /* 存不下就算了，不影响本次会话 */ }
}
// 切换后在按钮上回显档位名，1.2 秒后收回 "Aa"，避免顶栏被撑宽。
var fsResetTimer = null;
document.getElementById("fs-btn").onclick = function(){
  applyFs((fsIndex() + 1) % FS_STEPS.length);
  var btn = document.getElementById("fs-btn");
  btn.textContent = FS_STEPS[fsIndex()].name + "字号";
  if (fsResetTimer) clearTimeout(fsResetTimer);
  fsResetTimer = setTimeout(function(){ btn.textContent = "Aa"; }, 1200);
};

applyFs(fsIndex());
